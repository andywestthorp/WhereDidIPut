<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop Storage Manager</title>
  <!-- Tailwind CSS Stylesheet -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workshop">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Navigation / Header -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40" style="background-color: #0f172a;">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold flex items-center gap-2">
        🛠️ Workshop Storage Manager
      </h1>
      <button 
        onclick="toggleForm()" 
        class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition flex items-center gap-1 shadow">
        + Add New Item
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- Add Material Form Modal / Expandable Panel -->
    <div id="addFormContainer" class="hidden bg-white p-6 rounded-xl shadow-md border border-gray-200 transition-all">
      <h2 class="text-lg font-bold text-gray-900 mb-4 border-b pb-2">Add New Storage Material</h2>
      
      <form id="addMaterialForm" class="space-y-4" enctype="multipart/form-data">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          
          <!-- Name -->
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Item Name *</label>
            <input type="text" name="Name" required class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. 10W-40 Engine Oil">
          </div>

          <!-- Quantity -->
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Quantity *</label>
            <input type="number" name="Quantity" min="0" value="1" required class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <!-- Location Dropdown -->
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Storage Location *</label>
            <select id="itemLocationSelect" name="LocationID" required class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
              <option value="">-- Select Location --</option>
            </select>
          </div>

          <!-- Material Type Dropdown -->
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Material Type *</label>
            <select id="itemTypeSelect" name="MatTypeID" required class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
              <option value="">-- Select Type --</option>
            </select>
          </div>

          <!-- Photo Upload -->
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Photo (Optional)</label>
            <input type="file" id="photoInput" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
          </div>

        </div>

        <!-- Description -->
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Description</label>
          <textarea name="MaterialDescription" rows="2" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Add optional details, notes, or quantities..."></textarea>
        </div>

        <!-- Compressed Image Preview -->
        <div id="previewContainer" class="hidden mt-2">
          <p class="text-xs font-semibold text-gray-500 mb-1">Photo Preview:</p>
          <img id="imagePreview" src="" alt="Preview" class="h-32 rounded border object-cover">
        </div>

        <!-- Form Action Buttons -->
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="toggleForm()" class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-600 hover:bg-gray-50">
            Cancel
          </button>
          <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-md text-sm font-medium hover:bg-blue-700 shadow">
            Save Item
          </button>
        </div>
      </form>
    </div>

    <!-- Search & Filter Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row gap-4 items-center justify-between">
      
      <!-- Search Input -->
      <div class="relative w-full md:w-96">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
          🔍
        </span>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search items, descriptions, or locations..." 
          class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm"
        >
      </div>

      <!-- Filter Controls & Counter -->
      <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
        <span id="totalCounter" class="text-xs font-semibold text-gray-500 uppercase tracking-wider">
          Loading items...
        </span>

        <select id="locationFilter" class="border border-gray-300 rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">
          <option value="">All Locations</option>
        </select>
      </div>

    </div>

    <!-- Materials Grid Container -->
    <div id="materialsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <!-- Dynamic Material Cards Inserted Here via JavaScript -->
    </div>

  </main>

  <!-- Edit Material Modal -->
  <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg max-w-lg w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-lg font-bold text-gray-900">Edit Storage Item</h3>
        <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>

      <form id="editMaterialForm" class="space-y-4">
        <input type="hidden" id="editMaterialId" name="MaterialID">
        <input type="hidden" name="action" value="update">

        <!-- Item Name -->
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Item Name *</label>
          <input type="text" id="editName" name="Name" required class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Quantity -->
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Quantity in Stock *</label>
            <input type="number" id="editQuantity" name="Quantity" min="0" required class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <!-- Location Dropdown -->
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Storage Location *</label>
            <select id="editLocationSelect" name="LocationID" required class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
              <option value="">-- Select Location --</option>
            </select>
          </div>
        </div>

        <!-- Description -->
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Description</label>
          <textarea id="editDescription" name="MaterialDescription" rows="3" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Add optional details, notes, or dimensions..."></textarea>
        </div>

        <!-- Actions -->
        <div class="flex justify-between items-center pt-3 border-t">
          <button type="button" onclick="deleteItem()" class="px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-md text-sm font-medium border border-red-200">
            🗑️ Delete / Consumed
          </button>
          
          <div class="flex gap-2">
            <button type="button" onclick="closeEditModal()" class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-600 hover:bg-gray-50">
              Cancel
            </button>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm font-medium hover:bg-blue-700 shadow">
              Save Changes
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Application Logic -->
  <script>
    let processedPhotoBlob = null;
    let searchDebounceTimer = null;
    let currentMaterialsList = [];

    // Base API and Photo Directory Paths
    const API_BASE = './api/'; 
    const PHOTO_BASE = './photos/';

    // Offline-safe Data URI SVG fallback for missing images
    const FALLBACK_IMAGE = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='200' viewBox='0 0 300 200'><rect width='100%' height='100%' fill='%23f3f4f6'/><text x='50%' y='50%' font-family='sans-serif' font-size='14' fill='%239ca3af' text-anchor='middle' dy='.3em'>No Photo</text></svg>";

document.addEventListener('DOMContentLoaded', () => {
  fetchMaterials();
  loadDropdowns();
  setupEventListeners();

  // Register PWA Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('PWA Service Worker registered'))
      .catch(err => console.error('PWA registration failed:', err));
  }
});


    function handleImageError(img) {
      img.onerror = null;
      img.src = FALLBACK_IMAGE;
    }

    function toggleForm() {
      const container = document.getElementById('addFormContainer');
      if (container) container.classList.toggle('hidden');
    }

    function setupEventListeners() {
      const searchInput = document.getElementById('searchInput');
      const locationFilter = document.getElementById('locationFilter');

      if (searchInput) {
        searchInput.addEventListener('input', () => {
          clearTimeout(searchDebounceTimer);
          searchDebounceTimer = setTimeout(fetchMaterials, 300);
        });

        searchInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            clearTimeout(searchDebounceTimer);
            fetchMaterials();
          }
        });
      }

      if (locationFilter) {
        locationFilter.addEventListener('change', fetchMaterials);
      }
    }

    // Fetch Materials from API
    async function fetchMaterials() {
      const locationSelect = document.getElementById('locationFilter');
      const searchInput = document.getElementById('searchInput');
      const counter = document.getElementById('totalCounter');

      const locationId = locationSelect ? locationSelect.value : '';
      const searchQuery = searchInput ? searchInput.value.trim() : '';

      if (counter) counter.textContent = 'Searching...';

      const params = new URLSearchParams();
      if (locationId) params.append('location', locationId);
      if (searchQuery) params.append('search', searchQuery);

      try {
        const response = await fetch(`${API_BASE}materials.php?${params.toString()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const result = await response.json();

        if (result.status === 'success') {
          currentMaterialsList = result.data;
          renderMaterials(result.data);
          if (counter) counter.textContent = `Total Items: ${result.data.length}`;
        } else {
          if (counter) counter.textContent = 'Error loading items';
        }
      } catch (err) {
        console.error('Fetch materials error:', err);
        if (counter) counter.textContent = 'Error loading items';
      }
    }

    // Render Material Cards into Grid
    function renderMaterials(items) {
      const grid = document.getElementById('materialsGrid');
      if (!grid) return;

      if (!items || items.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-8 text-gray-500">No items match your query.</div>`;
        return;
      }

      grid.innerHTML = items.map(item => {
        const photoSrc = item.Photo ? `${PHOTO_BASE}${item.Photo}` : FALLBACK_IMAGE;
        const itemData = JSON.stringify(item).replace(/'/g, "&apos;").replace(/"/g, "&quot;");
        const qty = item.Quantity !== undefined ? item.Quantity : 1;

        return `
          <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden flex flex-col hover:shadow-md transition">
            <img 
              src="${photoSrc}" 
              alt="${item.Name}" 
              class="w-full h-40 object-cover bg-gray-50"
              onerror="handleImageError(this)"
            >
            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-start gap-2">
                  <h3 class="font-bold text-gray-900 leading-tight">${item.Name}</h3>
                  <button onclick='openEditModal(${itemData})' class="text-xs text-gray-400 hover:text-blue-600 p-1 font-semibold">
                    ✏️ Edit
                  </button>
                </div>
                <p class="text-xs text-gray-500 mt-1 line-clamp-2">${item.MaterialDescription || 'No description added.'}</p>
              </div>

              <div class="mt-4 pt-2 border-t border-gray-100 flex items-center justify-between text-xs">
                <span class="bg-blue-50 text-blue-700 font-medium px-2 py-1 rounded border border-blue-100">
                  📍 ${item.Location || 'Unassigned'}
                </span>

                <div class="flex items-center gap-1 bg-gray-100 rounded border border-gray-200 px-1 py-0.5">
                  <button onclick="quickAdjustQty(${item.MaterialID}, ${qty - 1})" class="px-1.5 py-0.5 font-bold hover:bg-white rounded text-gray-600">-</button>
                  <span class="font-semibold px-1 text-gray-800">${qty}</span>
                  <button onclick="quickAdjustQty(${item.MaterialID}, ${qty + 1})" class="px-1.5 py-0.5 font-bold hover:bg-white rounded text-gray-600">+</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Load Dropdowns for Forms & Filters
    async function loadDropdowns() {
      try {
        const locRes = await fetch(`${API_BASE}locations.php`);
        if (locRes.ok) {
          const locData = await locRes.json();
          if (locData.status === 'success') {
            const filterSelect = document.getElementById('locationFilter');
            const formSelect = document.getElementById('itemLocationSelect');

            locData.data.forEach(loc => {
              const label = loc.Location + (loc.LocationDescription ? ` (${loc.LocationDescription})` : '');
              if (filterSelect) filterSelect.innerHTML += `<option value="${loc.LocationID}">${label}</option>`;
              if (formSelect) formSelect.innerHTML += `<option value="${loc.LocationID}">${label}</option>`;
            });
          }
        }

        const typeRes = await fetch(`${API_BASE}types.php`);
        if (typeRes.ok) {
          const typeData = await typeRes.json();
          if (typeData.status === 'success') {
            const typeSelect = document.getElementById('itemTypeSelect');
            if (typeSelect) {
              typeData.data.forEach(type => {
                typeSelect.innerHTML += `<option value="${type.MatTypeID}">${type.MaterialType}</option>`;
              });
            }
          }
        }
      } catch (err) {
        console.error('Failed to populate dropdowns:', err);
      }
    }

    // Modal Control & Pre-population
    function openEditModal(item) {
      document.getElementById('editMaterialId').value = item.MaterialID;
      document.getElementById('editName').value = item.Name || '';
      document.getElementById('editQuantity').value = item.Quantity !== undefined ? item.Quantity : 1;
      document.getElementById('editDescription').value = item.MaterialDescription || '';

      const filterSelect = document.getElementById('locationFilter');
      const editSelect = document.getElementById('editLocationSelect');
      
      if (filterSelect && editSelect) {
        editSelect.innerHTML = filterSelect.innerHTML;
        if (editSelect.options[0] && editSelect.options[0].value === "") {
          editSelect.options[0].text = "-- Select Location --";
        }
        editSelect.value = item.LocationID || '';
      }

      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    // Handle Edit Form Submission
    document.getElementById('editMaterialForm')?.addEventListener('submit', async function(e) {
      e.preventDefault();
      const formData = new FormData(this);

      try {
        const res = await fetch(`${API_BASE}update_material.php`, { method: 'POST', body: formData });
        const result = await res.json();
        
        if (result.status === 'success') {
          closeEditModal();
          fetchMaterials();
        } else {
          alert(`Error: ${result.message}`);
        }
      } catch (err) {
        console.error('Update failed:', err);
      }
    });

    // Handle Delete / Consumed Action
    async function deleteItem() {
      const id = document.getElementById('editMaterialId').value;
      const name = document.getElementById('editName').value;

      if (!confirm(`Are you sure you want to delete "${name}"?`)) return;

      const formData = new FormData();
      formData.append('MaterialID', id);
      formData.append('action', 'delete');

      try {
        const res = await fetch(`${API_BASE}update_material.php`, { method: 'POST', body: formData });
        const result = await res.json();

        if (result.status === 'success') {
          closeEditModal();
          fetchMaterials();
        } else {
          alert(`Error: ${result.message}`);
        }
      } catch (err) {
        console.error('Delete failed:', err);
      }
    }

    // Quick Inline Quantity Adjustment (+/- buttons)
    async function quickAdjustQty(materialId, newQty) {
      if (newQty < 0) return;

      const item = currentMaterialsList.find(m => m.MaterialID == materialId);
      if (!item) return;

      const formData = new FormData();
      formData.append('MaterialID', materialId);
      formData.append('Quantity', newQty);
      formData.append('Name', item.Name);
      formData.append('MaterialDescription', item.MaterialDescription || '');
      formData.append('LocationID', item.LocationID);

      try {
        const res = await fetch(`${API_BASE}update_material.php`, { method: 'POST', body: formData });
        const result = await res.json();
        if (result.status === 'success') fetchMaterials();
      } catch (err) {
        console.error('Quantity update failed:', err);
      }
    }

    // Image Upload & Compression
    const photoInput = document.getElementById('photoInput');
    if (photoInput) {
      photoInput.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        processedPhotoBlob = await compressImage(file, 1200, 0.8);
        const preview = document.getElementById('imagePreview');
        const container = document.getElementById('previewContainer');
        if (preview) preview.src = URL.createObjectURL(processedPhotoBlob);
        if (container) container.classList.remove('hidden');
      });
    }

    function compressImage(file, maxWidth, quality) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
          };
        };
      });
    }

    // Save New Item Submission
    const addForm = document.getElementById('addMaterialForm');
    if (addForm) {
      addForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);

        if (processedPhotoBlob) {
          formData.append('photo', processedPhotoBlob, `photo_${Date.now()}.jpg`);
        }

        try {
          const response = await fetch(`${API_BASE}create_material.php`, {
            method: 'POST',
            body: formData
          });

          const result = await response.json();
          if (result.status === 'success') {
            alert('Item added successfully!');
            this.reset();
            const container = document.getElementById('previewContainer');
            if (container) container.classList.add('hidden');
            processedPhotoBlob = null;
            toggleForm();
            fetchMaterials();
          } else {
            alert(`Error: ${result.message}`);
          }
        } catch (err) {
          console.error('Submit error:', err);
        }
      });
    }
  </script>
</body>
</html>
